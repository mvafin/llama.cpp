name: "Linux - Setup OpenVINO Toolkit"
description: "Setup OpenVINO Toolkit for Linux"
inputs:
  path:
    description: "Installation path"
    required: true
  version_major:
    description: "OpenVINO major version (e.g., 2025.3); used only when channel=release"
    required: false
    default: ""
  version_full:
    description: "OpenVINO full version (e.g., 2025.3.0.19807.44526285f24); used only when channel=release"
    required: false
    default: ""
  channel:
    description: "Package channel: 'nightly' (latest master build, ships the GGUF frontend) or 'release'"
    required: false
    default: "nightly"

runs:
  using: "composite"
  steps:
    # Nightly builds are the only packages that ship the GGUF frontend the OpenVINO
    # backend links against. latest.txt maps each platform to the newest nightly URL,
    # so we always pick up the most recent build without pinning a dated path.
    - name: Resolve OpenVINO download URL
      id: url
      shell: bash
      run: |
        if [ "${{ inputs.channel }}" = "release" ]; then
          url="https://storage.openvinotoolkit.org/repositories/openvino/packages/${{ inputs.version_major }}/linux/openvino_toolkit_ubuntu24_${{ inputs.version_full }}_x86_64.tgz"
        else
          manifest="https://storage.openvinotoolkit.org/repositories/openvino/packages/nightly/latest.txt"
          url=$(curl --no-progress-meter -L "$manifest" | grep '^ubuntu24_x86_64:' | cut -d: -f2-)
          if [ -z "$url" ]; then
            echo "Failed to resolve latest nightly OpenVINO URL from $manifest" >&2
            exit 1
          fi
        fi
        echo "Using OpenVINO package: $url"
        echo "url=$url" >> "$GITHUB_OUTPUT"

    - name: Setup OpenVINO Toolkit
      id: setup
      uses: ./.github/actions/unarchive-tar
      with:
        url: ${{ steps.url.outputs.url }}
        path: ${{ inputs.path }}
        type: z
        strip: 1
